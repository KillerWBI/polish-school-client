name: CI (frontend)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      # Ошибок линта больше нет (были 18) — теперь падение линта блокирует сборку.
      # Остались только warning'и exhaustive-deps, они не роняют.
      - run: npm run lint
      - run: npm test
      - run: npm run build
